name: Deploy Wiki Site

on:
  repository_dispatch:
    types:
      - content-updated
  workflow_dispatch:
    inputs:
      content_ref:
        description: "Branch, tag, or SHA to publish from the content repository"
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CONTENT_REPOSITORY: depeng1994/ai-infra-wiki
  CONTENT_REF: ${{ github.event.client_payload.content_ref || github.event.inputs.content_ref || 'main' }}

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v6
        with:
          path: site-repo

      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ env.CONTENT_REF }}
          path: content-repo
          # Required if the content repository is private. For public repos this may be omitted,
          # but keeping it here makes the workflow work for both once the secret is configured.
          token: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}

      - name: Prepare publishable docs
        run: ./site-repo/scripts/prepare_content.sh ./content-repo

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site-repo/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r site-repo/requirements.txt

      - name: Build site
        run: mkdocs build --clean --config-file site-repo/mkdocs.yml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-repo/site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
